plugins {
    id 'com.android.application'
}

android {
    namespace 'com.camfloat.hdmi'
    compileSdk 34

    defaultConfig {
        applicationId 'com.camfloat.hdmi'
        minSdk 26
        // Target API 28 (the TV runs Android 9): avoids newer background/foreground-service restrictions.
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.4.1'
}
