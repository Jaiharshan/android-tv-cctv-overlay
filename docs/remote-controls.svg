<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="-apple-system,'SF Pro Display','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A160C"/><stop offset="1" stop-color="#140B08"/></linearGradient>
<linearGradient id="tv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2D3D8F"/><stop offset="1" stop-color="#6A2F6E"/></linearGradient>
<linearGradient id="cam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7B8F8A"/><stop offset="1" stop-color="#34433F"/></linearGradient>
<marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#E8A33D"/></marker>
</defs>
<rect width="1200" height="660" rx="24" fill="url(#bg)"/>
<text x="40" y="52" font-size="13" letter-spacing="4" font-weight="700" fill="#E8A33D">THREE SCREENS, ONE REMOTE</text>
<text x="40" y="92" font-size="32" font-weight="800" fill="#FFF1DE">Open it, look around, close it</text>
<g transform="translate(40,130)">
<rect width="340" height="215" rx="16" fill="url(#tv)"/>
<rect x="20" y="30" width="170" height="100" rx="8" fill="#fff" opacity=".07"/><circle cx="105" cy="80" r="22" fill="#fff" opacity=".12"/><path d="M98 70 L118 80 L98 90Z" fill="#fff" opacity=".5"/><rect x="214" y="14" width="112" height="76" rx="12" fill="url(#cam)" stroke="#E8A33D" stroke-width="4"/>
<path d="M218 86 L253.2 55.800000000000004 L275.6 68.72 L303.6 45.92 L322 86 Z" fill="#2F4A3A" opacity=".55"/>
<rect x="224" y="24" width="44" height="20" rx="10" fill="#000" opacity=".6"/>
<text x="232" y="38" font-size="12" fill="#fff" font-weight="600">Gate</text><rect x="196" y="96" width="140" height="20" rx="10" fill="#000" opacity=".7"/><text x="266" y="110" text-anchor="middle" font-size="9" fill="#fff">◀ ▶ camera · ▲ ▼ size · OK all</text>
<text x="170" y="252" text-anchor="middle" font-size="19" font-weight="700" fill="#FFF1DE">Small window</text>
<text x="170" y="277" text-anchor="middle" font-size="13.5" fill="#E7C9A1">Sits over any app. 4 sizes, movable.</text></g>
<g transform="translate(430,130)">
<rect width="340" height="215" rx="16" fill="url(#tv)"/>
<rect x="14" y="14" width="96" height="88" rx="10" fill="url(#cam)" stroke="#6B4B33" stroke-width="2"/>
<path d="M18 98 L47.599999999999994 62.400000000000006 L66.80000000000001 77.36 L90.80000000000001 50.96 L106 98 Z" fill="#2F4A3A" opacity=".55"/>
<rect x="24" y="24" width="65" height="20" rx="10" fill="#000" opacity=".6"/>
<text x="32" y="38" font-size="12" fill="#fff" font-weight="600">Parking</text><rect x="122" y="14" width="96" height="88" rx="10" fill="url(#cam)" stroke="#6B4B33" stroke-width="2"/>
<path d="M126 98 L155.6 62.400000000000006 L174.8 77.36 L198.8 50.96 L214 98 Z" fill="#2F4A3A" opacity=".55"/>
<rect x="132" y="24" width="79" height="20" rx="10" fill="#000" opacity=".6"/>
<text x="140" y="38" font-size="12" fill="#fff" font-weight="600">Rear Gate</text><rect x="230" y="14" width="96" height="88" rx="10" fill="url(#cam)" stroke="#E8A33D" stroke-width="4"/>
<path d="M234 98 L263.6 62.400000000000006 L282.8 77.36 L306.8 50.96 L322 98 Z" fill="#2F4A3A" opacity=".55"/>
<rect x="240" y="24" width="93" height="20" rx="10" fill="#000" opacity=".6"/>
<text x="248" y="38" font-size="12" fill="#fff" font-weight="600">Back Garden</text><rect x="14" y="112" width="96" height="88" rx="10" fill="url(#cam)" stroke="#6B4B33" stroke-width="2"/>
<path d="M18 196 L47.599999999999994 160.4 L66.80000000000001 175.36 L90.80000000000001 148.96 L106 196 Z" fill="#2F4A3A" opacity=".55"/>
<rect x="24" y="122" width="79" height="20" rx="10" fill="#000" opacity=".6"/>
<text x="32" y="136" font-size="12" fill="#fff" font-weight="600">Main Gate</text><rect x="122" y="112" width="96" height="88" rx="10" fill="url(#cam)" stroke="#6B4B33" stroke-width="2"/>
<path d="M126 196 L155.6 160.4 L174.8 175.36 L198.8 148.96 L214 196 Z" fill="#2F4A3A" opacity=".55"/>
<rect x="132" y="122" width="93" height="20" rx="10" fill="#000" opacity=".6"/>
<text x="140" y="136" font-size="12" fill="#fff" font-weight="600">Left Garden</text>
<text x="170" y="252" text-anchor="middle" font-size="19" font-weight="700" fill="#FFF1DE">All cameras</text>
<text x="170" y="277" text-anchor="middle" font-size="13.5" fill="#E7C9A1">Amber outline = selected camera.</text></g>
<g transform="translate(820,130)">
<rect width="340" height="215" rx="16" fill="url(#tv)"/>
<rect x="10" y="10" width="320" height="195" rx="14" fill="url(#cam)" stroke="#6B4B33" stroke-width="2"/>
<path d="M14 201 L122.0 117.25000000000001 L186.0 150.4 L266.0 91.89999999999999 L326 201 Z" fill="#2F4A3A" opacity=".55"/>
<rect x="20" y="20" width="93" height="20" rx="10" fill="#000" opacity=".6"/>
<text x="28" y="34" font-size="12" fill="#fff" font-weight="600">Back Garden</text><rect x="50" y="176" width="240" height="20" rx="10" fill="#000" opacity=".7"/><text x="170" y="190" text-anchor="middle" font-size="10" fill="#fff">Left/Right camera · OK or Back: all cameras</text>
<text x="170" y="252" text-anchor="middle" font-size="19" font-weight="700" fill="#FFF1DE">One camera</text>
<text x="170" y="277" text-anchor="middle" font-size="13.5" fill="#E7C9A1">Full screen, Left/Right to switch.</text></g>
<path d="M386 215 L424 215" stroke="#E8A33D" stroke-width="3" fill="none" marker-end="url(#ah)" stroke-linecap="round"/><path d="M776 215 L814 215" stroke="#E8A33D" stroke-width="3" fill="none" marker-end="url(#ah)" stroke-linecap="round"/>
<rect x="374" y="226" width="40" height="30" rx="15" fill="#2A1A10" stroke="#E8A33D" stroke-width="1.5"/><text x="394.0" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#FFD9A0">OK</text><rect x="764" y="226" width="40" height="30" rx="15" fill="#2A1A10" stroke="#E8A33D" stroke-width="1.5"/><text x="784.0" y="246" text-anchor="middle" font-size="13" font-weight="700" fill="#FFD9A0">OK</text>
<rect x="40" y="440" width="1120" height="180" rx="20" fill="#fff" opacity=".05"/>
<text x="64" y="472" font-size="13" letter-spacing="3" font-weight="700" fill="#E8A33D">KEYS</text>
<rect x="64" y="490" width="80" height="30" rx="15" fill="#2A1A10" stroke="#E8A33D" stroke-width="1.5"/><text x="104.0" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#FFD9A0">Mi ×2</text><text x="156" y="510" font-size="15" fill="#FFF1DE">open (the Mi remote's "mi" button, or MENU)</text>
<rect x="64" y="532" width="80" height="30" rx="15" fill="#2A1A10" stroke="#E8A33D" stroke-width="1.5"/><text x="104.0" y="552" text-anchor="middle" font-size="13" font-weight="700" fill="#FFD9A0">◀  ▶</text><text x="156" y="552" font-size="15" fill="#FFF1DE">next / previous camera</text>
<rect x="64" y="574" width="80" height="30" rx="15" fill="#2A1A10" stroke="#E8A33D" stroke-width="1.5"/><text x="104.0" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#FFD9A0">▲  ▼</text><text x="156" y="594" font-size="15" fill="#FFF1DE">bigger / smaller window</text>
<rect x="620" y="490" width="80" height="30" rx="15" fill="#2A1A10" stroke="#E8A33D" stroke-width="1.5"/><text x="660.0" y="510" text-anchor="middle" font-size="13" font-weight="700" fill="#FFD9A0">OK</text><text x="712" y="510" font-size="15" fill="#FFF1DE">all cameras, then open the selected one</text>
<rect x="620" y="532" width="80" height="30" rx="15" fill="#2A1A10" stroke="#E8A33D" stroke-width="1.5"/><text x="660.0" y="552" text-anchor="middle" font-size="13" font-weight="700" fill="#FFD9A0">Back</text><text x="712" y="552" font-size="15" fill="#FFF1DE">go up one level; then hand the remote back</text>
<rect x="620" y="574" width="80" height="30" rx="15" fill="#2A1A10" stroke="#E8A33D" stroke-width="1.5"/><text x="660.0" y="594" text-anchor="middle" font-size="13" font-weight="700" fill="#FFD9A0">Mi ×2</text><text x="712" y="594" font-size="15" fill="#FFF1DE">close the window completely</text>
<text x="1160" y="648" text-anchor="end" font-size="11" fill="#9C8467">Illustration only</text>
</svg>